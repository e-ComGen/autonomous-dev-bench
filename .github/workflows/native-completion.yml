name: Native qualification completion
on:
  push:
    branches: [fix/native-qualification-completion]
permissions:
  contents: read
  actions: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' pytest==8.4.2 pytest-subtests==0.14.2
      - run: python -m pytest -q --junitxml=artifacts/completion-tests.xml
      - name: Exact old entrypoint must lose keys; new host handoff and worker scrubbing must pass
        run: python tools/verify_credential_handoff.py
      - name: Exact old settings must reproduce backend rejection; new parser must preserve all budgets
        run: python tools/verify_settings_regression.py
      - name: Exact old collection must reproduce the operator import error; new phases must pass
        run: python tools/verify_gate_process_regression.py
      - name: Exact old adapters must fail the same regression that new adapters pass
        run: python tools/verify_gate_adapter_regression.py
      - name: Actual source dependency build and Windows curses in both fresh environments
        run: python tools/verify_dependency_upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-${{ matrix.os }}
          path: |
            artifacts/completion-tests.xml
            artifacts/dependency-upgrade.json
            artifacts/gate-adapter-*
            artifacts/gate-process-regression.json
            artifacts/settings-*
            artifacts/credential-*
          retention-days: 7
  qualification:
    needs: host
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' pytest==8.4.2
      - name: Real declared async, GitPython, dynamic-extra and plugin environments with source-edit negative control
        run: python tools/verify_recipe_environment.py
      - name: SQLFluff plugin/reference regression and retained seeded skip rejection, not full task acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_sqlfluff_qualification.py
      - name: Existing automatic real-issue qualification and exact replay, explicit three-repository CI pool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_native_issue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-qualification-${{ matrix.os }}
          path: |
            artifacts/recipe-environment*.json
            artifacts/qualification-sqlfluff*
            artifacts/native-issue.json
            artifacts/issue-process-*.log
          retention-days: 7
  package:
    needs: [host, qualification]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain bundled launch dependencies and seed projects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/e-ComGen/autonomous-dev-bench/actions/artifacts/10036777718/zip > native-base.zip
      - uses: actions/download-artifact@v4
        with:
          pattern: completion-*
          path: artifacts/acceptance
      - run: python tools/package_native_completion.py native-base.zip
      - name: Apply actual coherent overlay to older install with incompatible ProcessRunner and operator sentinels
        run: python tools/verify_completion_overlay.py native-base.zip
      - name: Exercise packaged Windows launcher without .git in a path with spaces
        run: python tools/verify_release.py
      - name: Traverse actual packaged START launch bench chain with test-only terminal probes
        run: python tools/verify_credential_handoff.py --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: native-completion-fix
          path: artifacts/completion-fix/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: autobench-native-complete
          path: artifacts/autobenchmark/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-packaging-evidence
          path: artifacts/release-evidence/
          retention-days: 7
