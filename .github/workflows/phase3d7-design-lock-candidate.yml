name: phase3d7-design-lock-candidate

on:
  pull_request:
    paths:
      - "PHASE3D_DESIGN_SCENARIOS.json"
      - "PHASE3D_DESIGN_DECISION.json"
      - "PHASE3D_DESIGN_RATIONALE.md"
      - "PHASE3D_EXPERIMENT_PLAN.json"
      - "packages/benchmark_core/**"
      - "tools/phase3d_prepare_design_decision.py"
      - ".github/workflows/phase3d7-design-lock-candidate.yml"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Generate exact outcome-blind design artifacts
        run: >-
          python tools/phase3d_prepare_design_decision.py
          PHASE3D_DESIGN_SCENARIOS.json
          PHASE3D_DESIGN_DECISION.json
          --output-dir phase3d7-design
      - name: Verify selected design summary
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("phase3d7-design")
          plan = json.loads((root / "PHASE3D_EXPERIMENT_PLAN.locked.candidate.json").read_text())
          evidence = json.loads((root / "PHASE3D6_DESIGN_DECISION_EVIDENCE.json").read_text())
          schedule = json.loads((root / "PHASE3D_PAIR_SCHEDULE.candidate.json").read_text())
          sensitivity = json.loads((root / "PHASE3D_SENSITIVITY_REPORT.json").read_text())

          assert plan["status"] == "LOCKED"
          assert plan["design_paid_ready"] is True
          assert plan["execution"]["repeat_count_per_task"] == 37
          assert plan["stopping"]["required_completed_pairs"] == 370
          assert plan["budget"]["total_model_token_cap_per_arm"] == 262144
          assert plan["budget"]["output_token_cap_per_arm"] == 65536
          assert plan["budget"]["max_requests_per_arm"] == 16
          assert plan["paid_paired_ab"] == "NOT_RUN"
          assert plan["winner"] == "UNKNOWN"
          assert evidence["schedule_pair_count"] == 370
          assert len(schedule["entries"]) == 370
          rows = {row["scenario_id"]: row for row in sensitivity["rows"]}
          assert rows["mde-10pp-conservative-discordance"]["repeat_count_per_task"] == 81
          assert rows["mde-15pp-conservative-discordance"]["repeat_count_per_task"] == 37
          assert rows["mde-20pp-conservative-discordance"]["repeat_count_per_task"] == 21
          assert sensitivity["outcome_data_used"] is False
          assert sensitivity["paid_model_called"] is False
          assert sensitivity["automatic_scenario_selection"] is False
      - uses: actions/upload-artifact@v4
        with:
          name: phase3d7-design-lock-candidate
          path: phase3d7-design/
          if-no-files-found: error
          retention-days: 30
