name: phase3-adcp-transport

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phase3-adcp-transport.yml"
      - "ADCP_RUNTIME.lock.json"
      - "suites/coding/harbor/adcp_agent.py"
      - "suites/coding/harbor/adcp_contract.py"
      - "suites/coding/harbor/workspace.py"
      - "tests/harbor_phase3_adcp/**"
      - "tools/verify_harbor_phase3_adcp.py"
      - "HARBOR.lock.json"

permissions:
  contents: read

jobs:
  adcp-transport-no-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install benchmark tests
        run: python -m pip install -e '.[dev]'

      - name: Fetch exact Harbor source pin
        shell: bash
        run: |
          set -euo pipefail
          HARBOR_COMMIT="$(python -c "import json; print(json.load(open('HARBOR.lock.json'))['commit'])")"
          rm -rf .phase3-harbor
          git init .phase3-harbor
          git -C .phase3-harbor remote add origin https://github.com/harbor-framework/harbor.git
          git -C .phase3-harbor fetch --depth=1 origin "$HARBOR_COMMIT"
          git -C .phase3-harbor checkout --detach FETCH_HEAD
          test "$(git -C .phase3-harbor rev-parse HEAD)" = "$HARBOR_COMMIT"
          python -m pip install -e .phase3-harbor
          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path

          lock = json.loads(Path('HARBOR.lock.json').read_text(encoding='utf-8'))
          observed = importlib.metadata.version('harbor')
          if observed != lock['version']:
              raise SystemExit(f"Harbor version mismatch: expected {lock['version']}, observed {observed}")
          print(f"Harbor pin verified: {observed} @ {lock['commit']}")
          PY

      - name: Check Docker substrate
        run: |
          docker version
          docker info

      - name: Run committed-candidate ADCP transport through Harbor
        env:
          AUTOBENCH_MODEL_GATEWAY_URL: http://fake-gateway.invalid/v1
          AUTOBENCH_MODEL_GATEWAY_USAGE_URL: http://fake-gateway.invalid/__autobench/usage
          AUTOBENCH_MODEL_GATEWAY_TOKEN: PHASE3_FAKE_GATEWAY_TOKEN_DO_NOT_PERSIST
        run: |
          rm -rf artifacts/harbor-phase3/adcp
          harbor trials start \
            -p tests/harbor_phase3_adcp \
            --agent suites.coding.harbor.adcp_agent:ADCPAgent \
            --trial-name phase3-adcp-transport \
            --trials-dir artifacts/harbor-phase3/adcp

      - name: Validate runtime identity, committed patch and no-model accounting
        run: python tools/verify_harbor_phase3_adcp.py --trials-dir artifacts/harbor-phase3/adcp

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-adcp-transport-${{ github.run_id }}
          path: artifacts/harbor-phase3/**
          if-no-files-found: warn
          retention-days: 14
