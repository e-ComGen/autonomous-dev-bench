name: phase2-harbor-substrate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/phase2-harbor-substrate.yml'
      - 'HARBOR.lock.json'
      - 'pyproject.toml'
      - 'suites/coding/harbor/**'
      - 'tests/harbor_phase2/**'
      - 'tests/coding/test_harbor_workspace.py'
      - 'tools/verify_harbor_phase2_substrate.py'

permissions:
  contents: read

jobs:
  substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install benchmark tests
        run: python -m pip install -e '.[dev]'
      - name: Fetch exact Harbor source pin
        shell: bash
        run: |
          set -euo pipefail
          HARBOR_COMMIT="$(python -c "import json; print(json.load(open('HARBOR.lock.json'))['commit'])")"
          rm -rf .phase2-harbor
          git init .phase2-harbor
          git -C .phase2-harbor remote add origin https://github.com/harbor-framework/harbor.git
          git -C .phase2-harbor fetch --depth=1 origin "$HARBOR_COMMIT"
          git -C .phase2-harbor checkout --detach FETCH_HEAD
          test "$(git -C .phase2-harbor rev-parse HEAD)" = "$HARBOR_COMMIT"
          python -m pip install -e .phase2-harbor
          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path

          lock = json.loads(Path('HARBOR.lock.json').read_text(encoding='utf-8'))
          observed = importlib.metadata.version('harbor')
          if observed != lock['version']:
              raise SystemExit(f"Harbor version mismatch: expected {lock['version']}, observed {observed}")
          print(f"Harbor pin verified: {observed} @ {lock['commit']}")
          PY
      - name: Check Docker substrate
        run: |
          docker version
          docker info
      - name: Run no-model Harbor external-agent trial
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/harbor-phase2/trials
          harbor trials start \
            -p tests/harbor_phase2 \
            --agent suites.coding.harbor.probe_agent:HarborSubstrateProbeAgent \
            --trial-name phase2-substrate \
            --trials-dir artifacts/harbor-phase2/trials
      - name: Validate Harbor result, telemetry and patch export
        run: python tools/verify_harbor_phase2_substrate.py --trials-dir artifacts/harbor-phase2/trials
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-harbor-substrate-${{ github.run_id }}
          path: artifacts/harbor-phase2/**
          if-no-files-found: warn
          retention-days: 14
