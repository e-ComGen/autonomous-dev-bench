name: Random A-B native runtime validation
on:
  push:
    branches: [feat/random-coding-ab]
    paths: [.github/workflows/random-ab-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the benchmark development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the actual host regression suite
        run: python -m pytest -q --junitxml=artifacts/host-tests.xml
      - name: Boot the production DeepSeek SDK driver in the production container
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import tempfile
          import time
          from suites.coding.settings import Settings
          from suites.coding.docker_runtime import DockerRuntime
          from suites.coding.native import NativeDriver
          root = Path.cwd()
          evidence = root / 'artifacts'
          evidence.mkdir(exist_ok=True)
          settings = Settings()
          with tempfile.TemporaryDirectory(prefix='ab-native-') as temporary:
              scratch = Path(temporary)
              runtime = DockerRuntime(root, scratch, settings)
              try:
                  image = runtime.prepare_image()
                  driver = NativeDriver(runtime, scratch / 'boot', settings, 'boot-only', time.monotonic() + 120)
                  returned = driver.invoke({'probe.py': 'VALUE = 1\n'}, 'Initialize without a model request.', boot_only=True)
                  records = list(returned) if isinstance(returned, tuple) else [returned]
                  receipt = next((item for item in records if isinstance(item, dict) and item.get('status') == 'BOOTED'), None)
                  if receipt is None:
                      raise RuntimeError('The real SDK driver did not return a BOOTED receipt')
                  (evidence / 'native-boot.json').write_text(json.dumps({
                      'native_sdk_started': True, 'live_model_called': False,
                      'coding_quality_measured': False, 'image': image,
                      'receipt': receipt,
                  }, indent=2, default=str))
              finally:
                  for index, path in enumerate(scratch.rglob('*.log')):
                      if index >= 20:
                          break
                      if path.is_file() and not path.is_symlink():
                          (evidence / f'native-{index}.log').write_bytes(path.read_bytes()[-65536:])
                  runtime.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-ab-native-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
