name: One-click foundation
on:
  push:
    branches: [feat/oneclick-benchmark-foundation]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneclick-test-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
