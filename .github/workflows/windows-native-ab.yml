name: Native Windows and Linux issue AB
on:
  push:
    branches: [feat/windows-native-ab]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Existing regression and native boundary tests
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: Real SDK boot, streaming and actual shell tool WITHOUT Docker
        run: python tools/verify_native_process.py
      - name: Real issue discovery, native install, repeated qualification and exact replay
        run: python tools/verify_native_issue.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare original offline fixtures and launcher wheels
        run: |
          python tools/bench.py projects --allow-network
          python -m pip download --only-binary=:all: --dest vendor/wheels -r tools/requirements-launcher.txt
      - name: Package and exercise actual launcher without git metadata
        run: |
          python tools/package_release.py
          python tools/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: |
            artifacts/tests.xml
            artifacts/native-*.json
            artifacts/native-*.log
            artifacts/issue-process-*.log
            artifacts/release-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success() && matrix.os == 'windows-latest'
        with:
          name: native-release-stage
          path: artifacts/autobenchmark/
          include-hidden-files: true
          retention-days: 7
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-release-stage
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: native-evidence-*
          path: release/.bench/validation-native
      - name: Attach checked same-commit native validation evidence
        run: python release/tools/attach_native_validation.py release
      - uses: actions/upload-artifact@v4
        with:
          name: autobench-windows-native
          path: release/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
