name: GitHub issue A-B
on:
  push:
    branches: [feat/github-issue-ab]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-host-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/verify_native_boot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-native
          path: artifacts/
          retention-days: 7
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Real discovery, clone, build, repeated bug/regression qualification and replay
        run: python tools/verify_issue_pipeline.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-qualification
          path: artifacts/
          retention-days: 7
