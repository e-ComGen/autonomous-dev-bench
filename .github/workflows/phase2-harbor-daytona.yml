name: phase2-harbor-daytona

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require optional Daytona controller credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DAYTONA_API_KEY:-}" ]; then
            echo "::error::Missing repository Actions secret DAYTONA_API_KEY"
            exit 2
          fi

      - name: Install benchmark tests
        run: python -m pip install -e '.[dev]'

      - name: Fetch exact Harbor source pin and Daytona SDK pin
        shell: bash
        run: |
          set -euo pipefail
          HARBOR_COMMIT="$(python -c "import json; print(json.load(open('HARBOR.lock.json'))['commit'])")"
          DAYTONA_VERSION="$(python -c "import json; print(json.load(open('HARBOR.lock.json'))['optional_remote_providers']['daytona']['sdk_version'])")"
          rm -rf .phase2-harbor
          git init .phase2-harbor
          git -C .phase2-harbor remote add origin https://github.com/harbor-framework/harbor.git
          git -C .phase2-harbor fetch --depth=1 origin "$HARBOR_COMMIT"
          git -C .phase2-harbor checkout --detach FETCH_HEAD
          test "$(git -C .phase2-harbor rev-parse HEAD)" = "$HARBOR_COMMIT"
          python -m pip install -e '.phase2-harbor[daytona]' "daytona==${DAYTONA_VERSION}"

          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path

          lock = json.loads(Path('HARBOR.lock.json').read_text(encoding='utf-8'))
          observed_harbor = importlib.metadata.version('harbor')
          observed_daytona = importlib.metadata.version('daytona')
          expected_daytona = lock['optional_remote_providers']['daytona']['sdk_version']
          if observed_harbor != lock['version']:
              raise SystemExit(
                  f"Harbor version mismatch: expected {lock['version']}, observed {observed_harbor}"
              )
          if observed_daytona != expected_daytona:
              raise SystemExit(
                  f"Daytona SDK mismatch: expected {expected_daytona}, observed {observed_daytona}"
              )
          print(
              f"Optional remote provider pins verified: Harbor {observed_harbor} @ {lock['commit']}; "
              f"Daytona SDK {observed_daytona}"
          )
          PY

      - name: Verify pinned Daytona wheel identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/harbor-phase2/daytona-wheel
          mkdir -p artifacts/harbor-phase2/daytona-wheel
          DAYTONA_VERSION="$(python -c "import json; print(json.load(open('HARBOR.lock.json'))['optional_remote_providers']['daytona']['sdk_version'])")"
          python -m pip download --no-deps --only-binary=:all: \
            --dest artifacts/harbor-phase2/daytona-wheel \
            "daytona==${DAYTONA_VERSION}"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = json.loads(Path('HARBOR.lock.json').read_text(encoding='utf-8'))
          pin = lock['optional_remote_providers']['daytona']
          wheel = Path('artifacts/harbor-phase2/daytona-wheel') / pin['wheel']
          if not wheel.is_file():
              raise SystemExit(f"Pinned Daytona wheel was not downloaded: {wheel}")
          observed = hashlib.sha256(wheel.read_bytes()).hexdigest()
          if observed != pin['wheel_sha256']:
              raise SystemExit(
                  f"Daytona wheel SHA mismatch: expected {pin['wheel_sha256']}, observed {observed}"
              )
          print(f"Daytona wheel SHA verified: {observed}")
          PY

      - name: Run optional no-model Harbor trial in Daytona cloud
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/harbor-phase2/daytona
          harbor trials start \
            -p tests/harbor_phase2 \
            --agent suites.coding.harbor.daytona_probe_agent:HarborDaytonaRemoteProbeAgent \
            --env daytona \
            --environment-kwarg expose_sandbox_id=true \
            --trial-name phase2-daytona-remote \
            --trials-dir artifacts/harbor-phase2/daytona

      - name: Validate optional remote provider identity, Linux execution, patch and secret boundary
        run: |
          python tools/verify_harbor_phase2_daytona.py \
            --trials-dir artifacts/harbor-phase2/daytona

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-harbor-daytona-${{ github.run_id }}
          path: artifacts/harbor-phase2/**
          if-no-files-found: warn
          retention-days: 14
