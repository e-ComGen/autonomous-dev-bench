name: phase3c-adcp-harbor-fake

on:
  pull_request:
    paths:
      - "suites/coding/harbor/adcp_agent.py"
      - "suites/coding/harbor/workspace.py"
      - "suites/coding/harbor/cas_export.py"
      - "tools/verify_phase3c_adcp_fake_harbor.py"
      - "tests/harbor_phase3c_adcp_fake/**"
      - "tests/core/test_adcp_harbor_contract.py"
      - "tests/coding/test_harbor_workspace.py"
      - "tests/coding/test_harbor_cas_export.py"
      - "ADCP.lock.json"
      - "HARBOR.lock.json"
      - "qualification/PHASE3D_PRODUCT_READINESS_HOST_20260910.json"
      - ".github/workflows/phase3c-adcp-harbor-fake.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HARBOR_COMMIT: d4509bbd3804f4b408527f476d764dacd988791d

jobs:
  fake-adcp-harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Checkout exact pinned Harbor source
        uses: actions/checkout@v4
        with:
          repository: harbor-framework/harbor
          ref: ${{ env.HARBOR_COMMIT }}
          path: .phase3c-harbor
          persist-credentials: false
          fetch-depth: 1
      - name: Verify Harbor source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .phase3c-harbor rev-parse HEAD)" = "$HARBOR_COMMIT"
          test -z "$(git -C .phase3c-harbor status --porcelain --untracked-files=all)"
          python - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('HARBOR.lock.json').read_text(encoding='utf-8'))
          assert lock['commit'] == os.environ['HARBOR_COMMIT'], (lock['commit'], os.environ['HARBOR_COMMIT'])
          assert lock['version'] == '0.22.0'
          PY
      - name: Install benchmark and exact Harbor source
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -e .phase3c-harbor
      - name: Prepare isolated absolute fake task path
        shell: bash
        run: |
          set -euo pipefail
          TASK="$RUNNER_TEMP/phase3c-adcp-fake-task"
          rm -rf "$TASK"
          cp -a tests/harbor_phase3c_adcp_fake "$TASK"
          test -f "$TASK/task.toml"
          echo "PHASE3C_FAKE_TASK=$TASK" >> "$GITHUB_ENV"
      - name: Run fake ADCP Harbor process boundary
        env:
          AUTOBENCH_ADCP_FAKE_RUNTIME: "1"
          AUTOBENCH_MODEL_PROXY_BASE_URL: "http://127.0.0.1:9/v1"
          AUTOBENCH_MODEL_PROXY_TOKEN: "phase3c-fake-proxy-token"
        run: |
          set -euo pipefail
          rm -rf artifacts/phase3c-adcp
          harbor trials start -p "$PHASE3C_FAKE_TASK" \
            --agent suites.coding.harbor.adcp_agent:ADCPHarborAgent \
            --trial-name phase3c-adcp-fake \
            --trials-dir "$GITHUB_WORKSPACE/artifacts/phase3c-adcp/trials"

      - name: Validate Harbor patch and ADCP process receipt independently
        run: >-
          python tools/verify_phase3c_adcp_fake_harbor.py
          --trials-dir artifacts/phase3c-adcp/trials

      - name: Assert fake qualification remains non-authoritative after host promotion
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('artifacts/phase3c-adcp/PHASE3C_ADCP_FAKE_HARBOR.json')
          evidence = json.loads(p.read_text(encoding='utf-8'))
          lock = json.loads(Path('ADCP.lock.json').read_text(encoding='utf-8'))
          qualification = json.loads(Path('qualification/PHASE3D_PRODUCT_READINESS_HOST_20260910.json').read_text(encoding='utf-8'))
          assert evidence['status'] == 'PASS'
          assert evidence['fake_runtime'] is True
          assert evidence['private_runtime_loaded'] is False
          assert evidence['paid_model_called'] is False
          assert evidence['production_ready'] is False
          assert evidence['production_blocker'] == 'PINNED_PRIVATE_ADCP_RUNTIME_NOT_QUALIFIED'
          assert lock['fake_process_boundary_status'] == 'PASS'
          assert lock['private_pinned_runtime_qualification_status'] == 'PASS'
          assert lock['paid_ready'] is True
          assert lock['production_blocker'] is None
          assert qualification['status'] == 'PASS'
          assert lock['host_product_readiness']['qualification_record'] == 'qualification/PHASE3D_PRODUCT_READINESS_HOST_20260910.json'
          assert qualification['paid_admission']['paid_paired_ab_started'] is False

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c-adcp-fake-harbor-${{ github.run_id }}
          path: artifacts/phase3c-adcp/**
          if-no-files-found: warn
          retention-days: 30
