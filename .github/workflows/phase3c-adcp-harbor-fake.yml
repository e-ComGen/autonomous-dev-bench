name: phase3c-adcp-harbor-fake

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ADCP.lock.json"
      - "suites/coding/adcp_contract.py"
      - "suites/coding/harbor/adcp_agent.py"
      - "tests/core/test_adcp_harbor_contract.py"
      - "tests/harbor_phase3c_adcp_fake/**"
      - "tools/verify_phase3c_adcp_fake_harbor.py"
      - ".github/workflows/phase3c-adcp-harbor-fake.yml"

permissions:
  contents: read

jobs:
  qualify-fake-process-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark test boundary
        run: python -m pip install -e '.[dev]'

      - name: Run public ADCP receipt contract tests
        run: python -m pytest tests/core/test_adcp_harbor_contract.py

      - name: Fetch exact Harbor source pin
        shell: bash
        run: |
          set -euo pipefail
          HARBOR_COMMIT="$(python -c "import json; print(json.load(open('HARBOR.lock.json'))['commit'])")"
          rm -rf .phase3c-harbor
          git init .phase3c-harbor
          git -C .phase3c-harbor remote add origin https://github.com/harbor-framework/harbor.git
          git -C .phase3c-harbor fetch --depth=1 origin "$HARBOR_COMMIT"
          git -C .phase3c-harbor checkout --detach FETCH_HEAD
          test "$(git -C .phase3c-harbor rev-parse HEAD)" = "$HARBOR_COMMIT"
          python -m pip install -e .phase3c-harbor
          python - <<'PY'
          import importlib.metadata, json
          from pathlib import Path
          lock = json.loads(Path('HARBOR.lock.json').read_text(encoding='utf-8'))
          observed = importlib.metadata.version('harbor')
          assert observed == lock['version'], (observed, lock['version'])
          print(f"Harbor pin verified: {observed} @ {lock['commit']}")
          PY

      - name: Run deterministic no-model ADCP Harbor process qualification
        shell: bash
        env:
          AUTOBENCH_ADCP_FAKE_RUNTIME: "1"
          AUTOBENCH_MODEL_PROXY_BASE_URL: "http://127.0.0.1:9/v1"
          AUTOBENCH_MODEL_PROXY_TOKEN: "qualification-proxy-token"
        run: |
          set -euo pipefail
          rm -rf artifacts/phase3c-adcp/trials
          harbor trials start \
            -p tests/harbor_phase3c_adcp_fake \
            --agent suites.coding.harbor.adcp_agent:ADCPHarborAgent \
            --trial-name phase3c-adcp-fake \
            --trials-dir artifacts/phase3c-adcp/trials

      - name: Validate Harbor patch and ADCP process receipt independently
        run: >-
          python tools/verify_phase3c_adcp_fake_harbor.py
          --trials-dir artifacts/phase3c-adcp/trials

      - name: Assert fake qualification cannot be promoted to production
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('artifacts/phase3c-adcp/PHASE3C_ADCP_FAKE_HARBOR.json')
          evidence = json.loads(p.read_text(encoding='utf-8'))
          lock = json.loads(Path('ADCP.lock.json').read_text(encoding='utf-8'))
          assert evidence['status'] == 'PASS'
          assert evidence['fake_runtime'] is True
          assert evidence['private_runtime_loaded'] is False
          assert evidence['paid_model_called'] is False
          assert evidence['production_ready'] is False
          assert evidence['production_blocker'] == 'PINNED_PRIVATE_ADCP_RUNTIME_NOT_QUALIFIED'
          assert lock['fake_process_boundary_status'] == 'PASS'
          assert lock['private_pinned_runtime_qualification_status'] == 'NOT_RUN'
          assert lock['paid_ready'] is False

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3c-adcp-fake-harbor-${{ github.run_id }}
          path: artifacts/phase3c-adcp/**
          if-no-files-found: warn
          retention-days: 30
