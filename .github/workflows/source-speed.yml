name: Exact source acquisition qualification
on:
  push:
    branches: [fix/fast-pinned-acquisition]
permissions:
  contents: read
  actions: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=artifacts/source-tests.xml
      - name: Measure identical source bytes against the exact previous implementation
        run: python tools/measure_source_speed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evidence-${{ matrix.os }}
          path: |
            artifacts/source-tests.xml
            artifacts/source-speed.json
          retention-days: 7
  package:
    needs: host
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact native base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/e-ComGen/autonomous-dev-bench/actions/artifacts/10031359627/zip > native-base.zip
      - run: python tools/package_fast_acquisition.py native-base.zip
      - name: Re-run the packaged Windows launcher with bundled dependencies and no .git
        run: python tools/verify_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-packaging-evidence
          path: artifacts/release-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: autobench-source-fast
          path: artifacts/autobenchmark/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: source-fast-fix
          path: artifacts/source-fix/
          include-hidden-files: true
          retention-days: 7
