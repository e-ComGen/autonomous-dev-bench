# START.cmd: random real GitHub issue -> stock DSH and actual ADCP -> independent tests.
# No reconstruction or synthetic-task fallback is used by this default.
task_source = "github_issue"
model = "deepseek-v4-flash"
tasks = 1
repeats = 1
arm_seconds = 600
check_seconds = 120
requests_per_arm = 16
output_tokens_per_request = 4096
request_bytes = 262144
memory_mb = 2048
cpus = 2
max_patch_bytes = 262144

[github]
# Empty means automatic public Python repository discovery; not a fixed project list.
repositories = []
repository_pool = 50
max_repositories = 20
pulls_per_repository = 30
max_candidates = 40
tasks_per_project = 1
min_stars = 20
max_stars = 1000000
since = "2022-01-01"
max_api_requests = 200
api_seconds = 1800
prepare_seconds = 1800
fetch_seconds = 180
build_seconds = 300
qualification_repeats = 2
public_test_files = 8
# Measured Python source lines: small <5000, medium <20000, large >=20000.
# Nonzero values are REQUIRED distinct qualified projects, never silently downgraded.
small_projects = 0
medium_projects = 0
large_projects = 0
