# One click: native Windows by default, Docker on Linux. Override with --backend native|docker.
execution_backend = "auto"
task_source = "github_issue"
model = "deepseek-v4-flash"
tasks = 1
repeats = 1
arm_seconds = 600
check_seconds = 120
requests_per_arm = 16
output_tokens_per_request = 4096
request_bytes = 262144
# CPU/RAM enforcement below is Docker-only; native mode reports these as unenforced.
memory_mb = 2048
cpus = 2
max_patch_bytes = 262144

[github]
repositories = []
repository_pool = 50
max_repositories = 20
pulls_per_repository = 30
max_candidates = 40
tasks_per_project = 1
min_stars = 20
max_stars = 1000000
since = "2022-01-01"
max_api_requests = 200
api_seconds = 1800
prepare_seconds = 1800
fetch_seconds = 180
build_seconds = 300
qualification_repeats = 2
public_test_files = 8
small_projects = 0
medium_projects = 0
large_projects = 0
